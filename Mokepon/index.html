<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MokePon!</title>
        <script src="/Mokepon/js/mokepon.js" defer></script>
    </head>
    <body>
        <h1>MokePon! 🔥 🌊 🌱</h1>
        <section id="seleccionar-mascota">
            <h2>Selecciona tu mascota</h2>
            <input type="radio" name="mascota" id="Hipodoge">
            <label for="Hipodoge">Hipodoge</label>
            <input type="radio" name="mascota" id="Capipepo">
            <label for="Capipepo">Capipepo</label>
            <input type="radio" name="mascota" id="Ratigueya">
            <label for="Ratigueya">Ratigueya</label>
            <input type="radio" name="mascota" id="Langostelvis">
            <label for="Langostelvis">Langostelvis</label>
            <input type="radio" name="mascota" id="Tucapalma">
            <label for="Tucapalma">Tucapalma</label>
            <input type="radio" name="mascota" id="Pydos">
            <label for="Pydos">Pydos</label>
            <!-- Hipodoge -> Agua
                Capipepo -> Tierra
                Ratigueya -> Fuego
                Langostelvis -> Agua y Fuego
                Tucapalma -> Agua y Tierra
                Pydos -> Tierra y Fuego 
            -->
            <button id ="btnSelecMascota">Seleccionar</button>
        </section>
        <section id="seleccionar-ataque">
            <h2>Selecciona un ataque</h2>
            <p>Tu mascota <span id="nombre-mascota"></span> tiene <span>3</span> vidas</p>
            <p>La mascota <span id="nombre-enemigo"></span> de tu enemigo tiene <span>3</span> vidas</p>
            <P>
                <button id="btnAttackFire">Fuego 🔥</button>
                <button id="btnAttackWater">Agua 🌊</button>
                <button id="btnAttackEarth">Tierra 🌱</button>
            </P>
        </section>
        <section id="mensajes">
            <p>Tu mascota ataco con <span id="ataque-jugador"></span>, la mascota de tu enemigo ataco con <span id="ataque-enemigo"></span> y perdió 1 vida</p>
        </section>
        <section id="reiniciar">
            <button id="btnRestart">Reiniciar</button>
        </section>
    </body>
</html>
